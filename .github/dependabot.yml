version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # uv (not pip) so Dependabot also updates uv.lock; CI runs `uv sync --locked`.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # owlpost is built on FastMCP from mcp 1.x; mcp 2.x is a breaking rewrite.
      - dependency-name: mcp
        versions: [">=2"]
