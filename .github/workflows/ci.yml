name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Check the registry marker survives packaging
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep -F 'mcp-name: io.github.smankoo/owlpost'
          tar -xzOf dist/*.tar.gz --wildcards '*/README.md' | grep -F 'mcp-name: io.github.smankoo/owlpost'

      - name: MCP stdio smoke test (installed wheel)
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/owlpost --version
          uv run python scripts/smoke_stdio.py /tmp/wheel-env/bin/owlpost

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: owlpost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check registry label
        run: |
          label=$(docker inspect owlpost:ci --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}')
          test "$label" = "$(jq -r .name server.json)"

      - uses: astral-sh/setup-uv@v7

      - name: MCP stdio smoke test (container)
        run: |
          uv sync --locked
          uv run python scripts/smoke_stdio.py \
            docker run -i --rm --mount 'type=bind,src={config_dir},dst=/config,readonly' owlpost:ci

  server-json:
    name: Validate server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Validate against the registry schema
        run: |
          uv sync --locked
          uv run python scripts/validate_server_json.py server.json
