# owlpost account configuration — example
#
# Copy this file to ~/.config/owlpost/accounts.toml and fill in your own
# credentials. Each [accounts.<name>] block defines one mailbox. The <name>
# is what you'll pass to MCP tools as the `account` argument.
#
# owlpost looks for the config at, in order: the --config flag, the
# OWLPOST_CONFIG environment variable, then ~/.config/owlpost/accounts.toml.
#
# IMPORTANT: use app-specific passwords, not your real password.
#   - iCloud: https://account.apple.com → Sign-In and Security → App-Specific Passwords
#   - Gmail:  https://myaccount.google.com/apppasswords (requires 2FA enabled)
#
# Each account needs exactly ONE of:
#   password         = "..."              the password itself
#   password_env     = "VAR_NAME"         read from an environment variable
#   password_command = "op read op://..." run a command (no shell, 10s timeout)
#                                         and use its output, minus the
#                                         trailing newline
# If you keep a password in this file, chmod 600 it.

[accounts.icloud]
email = "you@icloud.com"           # or your @me.com / custom domain alias
password = "xxxx-xxxx-xxxx-xxxx"   # iCloud app-specific password
provider = "icloud"
imap_host = "imap.mail.me.com"
imap_port = 993
smtp_host = "smtp.mail.me.com"
smtp_port = 587
# iCloud SMTP does NOT auto-save sent messages — owlpost will APPEND to Sent.
auto_save_sent = true

[accounts.gmail]
email = "you@gmail.com"
# Read the Gmail app password (16 chars, spaces ok) from the environment.
# Set it in your MCP client's "env" block.
password_env = "OWLPOST_GMAIL_PASSWORD"
provider = "gmail"
imap_host = "imap.gmail.com"
imap_port = 993
smtp_host = "smtp.gmail.com"
smtp_port = 587
# Gmail SMTP auto-saves to "Sent Mail" — APPENDing would create duplicates.
auto_save_sent = false

# Generic example for any other IMAP/SMTP provider (Fastmail, your own
# server, etc.). Set provider = "generic" to skip provider-specific
# behaviors. Here the password comes from a password manager.
#
# [accounts.work]
# email = "you@example.com"
# password_command = "op read op://Private/Work Mail/app-password"
# # or: password_command = "pass show mail/work"
# # or: password_command = "security find-generic-password -s owlpost-work -w"
# provider = "generic"
# imap_host = "imap.example.com"
# imap_port = 993
# imap_security = "ssl"        # or "starttls" for port 143
# smtp_host = "smtp.example.com"
# smtp_port = 587
# smtp_security = "starttls"   # or "ssl" for port 465
# auto_save_sent = true

# Proton Mail via Proton Bridge (runs locally, exposes IMAP on 127.0.0.1).
# Bridge uses STARTTLS with a self-signed cert, so we disable TLS verify.
# Get the bridge password from the Bridge app (Account → Mailbox password).
#
# [accounts.proton]
# email = "you@protonmail.com"
# password = "bridge-password-xxxx"
# provider = "generic"
# imap_host = "127.0.0.1"
# imap_port = 1143
# imap_security = "starttls"
# smtp_host = "127.0.0.1"
# smtp_port = 1025
# smtp_security = "starttls"
# tls_verify = false
# auto_save_sent = true
